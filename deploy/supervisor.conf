; Yapboz Kırtasiye — kuyruk işçisi (/etc/supervisor/conf.d/yapboz-queue.conf). E-postalar bununla gönderilir.
; Her yayından sonra deploy/yayinla.sh "php artisan queue:restart" çalıştırır; supervisor işçiyi yeni kodla yeniden başlatır.
[program:yapboz-queue]
command=php /var/www/yapboz/current/artisan queue:work --tries=3 --sleep=2 --max-time=3600
directory=/var/www/yapboz/current
user=www-data
autostart=true
autorestart=true
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/yapboz/shared/storage/logs/queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

; Fotokopi belgeleri: Word/PowerPoint → PDF çevirme ve sayfa sayımı (uzun sürebilir; ayrı kuyruk ve işçi).
[program:yapboz-print]
command=php /var/www/yapboz/current/artisan queue:work --queue=print --tries=1 --timeout=330 --sleep=2 --max-time=3600
directory=/var/www/yapboz/current
user=www-data
autostart=true
autorestart=true
stopwaitsecs=340
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/yapboz/shared/storage/logs/print-queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
