; Yapboz Kırtasiye — PHP ayarları (/etc/php/8.5/fpm/conf.d/99-yapboz.ini ve cli/conf.d/99-yapboz.ini)
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 120
expose_php = Off
date.timezone = UTC

opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
; Kod yalnızca yayınla değişir (yeni sürüm klasörü + PHP yeniden yüklenir); dosya değişikliği dakikada bir denetlenir.
opcache.revalidate_freq = 60
; Dosya yolu çözümleme önbelleği (her istekte binlerce sınıf dosyası için disk sorgusu yapılmaz).
realpath_cache_size = 4096K
realpath_cache_ttl = 600
