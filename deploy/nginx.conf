# Yapboz Kırtasiye — Nginx sitesi (/etc/nginx/sites-available/yapboz).
# __DOMAIN__ kurulumda gerçek alan adıyla değiştirilir (IDN ise punycode: xn--...).
# HTTPS satırlarını certbot --nginx ekler. Ayrıntı: docs/kilavuz/kurulum.md

# www → çıplak alan adı (mağaza)
server {
    listen 80;
    listen [::]:80;
    server_name www.__DOMAIN__;
    return 301 https://__DOMAIN__$request_uri;
}

# Mağaza (__DOMAIN__), mağaza yönetimi (yonetim.) ve B2B (b2b.) aynı uygulamadır; ayrım uygulamada alan adına göre yapılır.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ yonetim.__DOMAIN__ b2b.__DOMAIN__;

    root /var/www/yapboz/current/public;
    index index.php;
    charset utf-8;

    # Vitrin videoları (50 MB) için; php.ini ile aynı sınır.
    client_max_body_size 64m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Derlenmiş varlıklar adlarında içerik özeti taşır; uzun süre önbelleğe alınabilir.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ \.php$ {
        return 404;
    }
}
